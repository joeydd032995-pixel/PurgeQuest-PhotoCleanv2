name: iOS Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Select an available iPhone simulator
        run: |
          simulator_udid="$(
            xcrun simctl list -j devices available |
            jq -r '[.devices | to_entries[]
              | select(.key | test("iOS-(1[89]|[2-9][0-9])-"))
              | .value[]
              | select(.name | startswith("iPhone"))
              | .udid][0] // empty'
          )"
          if [[ -z "$simulator_udid" ]]; then
            echo 'No available iPhone simulator running iOS 18 or newer.' >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
      - name: Build and run PurgeQuest unit tests
        env:
          # SnapshotRenderTests saves PNG renders of the new UI here (xcodebuild
          # strips the TEST_RUNNER_ prefix before handing it to the tests).
          TEST_RUNNER_SNAPSHOT_DIR: ${{ runner.temp }}/ui-snapshots
        run: |
          xcodebuild \
            -project ios/PurgeQuest.xcodeproj \
            -scheme PurgeQuest \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -only-testing:PurgeQuestTests \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Run Forge UI tests
        run: |
          xcodebuild \
            -project ios/PurgeQuest.xcodeproj \
            -scheme PurgeQuest \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -only-testing:PurgeQuestUITests/ForgeUITests \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Capture Light/Dark appearance tour
        # Opt-in screenshots of the real app; never fails the build.
        continue-on-error: true
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ runner.temp }}/ui-snapshots
        run: |
          # Pre-grant photo access so the system prompt never covers the screenshots.
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl privacy "$SIMULATOR_UDID" grant photos com.purgequest.app || true
          xcodebuild \
            -project ios/PurgeQuest.xcodeproj \
            -scheme PurgeQuest \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -only-testing:PurgeQuestUITests/AppearanceTourUITests \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ${{ runner.temp }}/ui-snapshots
          if-no-files-found: ignore
          retention-days: 14
